<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShieldBlock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-shield" id="shieldLogo">
          <svg viewBox="0 0 24 24" fill="none" class="shield-svg">
            <path d="M12 2L4 5V11C4 16.5 7.5 21.5 12 22C16.5 21.5 20 16.5 20 11V5L12 2Z" fill="url(#shieldGrad)" />
            <path d="M9 12L11 14L15 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="shieldGrad" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10B981" />
                <stop offset="1" stop-color="#059669" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <h1>ShieldBlock</h1>
          <span class="badge">PRO • MV3</span>
        </div>
      </div>
      <button class="icon-btn" id="openSettingsBtn" title="Extension Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Master Power Hero Section -->
    <section class="master-hero">
      <button class="power-button" id="masterToggle" aria-label="Toggle Protection">
        <div class="power-ring"></div>
        <div class="power-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="power-icon">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" stroke-linecap="round"></path>
          </svg>
        </div>
      </button>
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Protection Active</span>
      </div>
    </section>

    <!-- Current Site Card -->
    <section class="site-card">
      <div class="site-info">
        <div class="site-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="site-svg">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="site-details">
          <span class="site-label">Current Website</span>
          <span class="site-domain" id="siteDomain">Loading...</span>
        </div>
      </div>
      <label class="switch" title="Pause on this site">
        <input type="checkbox" id="siteWhitelistToggle">
        <span class="slider round"></span>
      </label>
    </section>

    <!-- Live Statistics Section -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon-wrap page-ad-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
          </svg>
        </div>
        <div class="stat-meta">
          <span class="stat-num" id="pageBlockedCount">0</span>
          <span class="stat-title">Blocked on Page</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrap total-ad-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="stat-meta">
          <span class="stat-num" id="totalBlockedCount">0</span>
          <span class="stat-title">All-Time Blocked</span>
        </div>
      </div>
    </section>

    <!-- Quick Preferences -->
    <section class="toggles-list">
      <div class="toggle-row">
        <div class="toggle-meta">
          <span class="toggle-title">Cosmetic DOM Clean</span>
          <span class="toggle-desc">Collapses hidden ad placeholders</span>
        </div>
        <label class="switch mini">
          <input type="checkbox" id="cosmeticToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-meta">
          <span class="toggle-title">Telemetry & Trackers</span>
          <span class="toggle-desc">Blocks analytics and tracking beacons</span>
        </div>
        <label class="switch mini">
          <input type="checkbox" id="trackerToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </section>

    <!-- Footer Action -->
    <footer class="footer">
      <button class="reload-btn" id="reloadTabBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Reload Page to Apply</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
